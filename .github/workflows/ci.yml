# MAGNET Ship Design Validation System
# CI/CD Pipeline
# BRAVO OWNS THIS FILE.

name: MAGNET CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # UIv2 smoke (nightly) — runs on default branch only.
    - cron: "0 2 * * *"
    # Optional Phase 3 health-check (weekly) — runs on default branch only.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      run_capytaine_service:
        description: "Run Phase 3 Capytaine service-boundary tests"
        required: false
        default: "false"
      run_uiv2_ui_smoke:
        description: "Run UIv2 Playwright smoke test"
        required: false
        default: "false"

env:
  PYTHON_VERSION: '3.11'
  MAGNET_ENVIRONMENT: test
  MAGNET_LLM_PROVIDER: mock

jobs:
  # ==========================================================================
  # Lint & Type Check
  # ==========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black mypy

      - name: Run flake8
        run: flake8 magnet/ tests/ --max-line-length=120 --ignore=E501,W503
        continue-on-error: true

      - name: Run black check
        run: black --check --line-length=120 magnet/ tests/
        continue-on-error: true

      - name: Run mypy
        run: mypy magnet/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/unit -v --cov=magnet --cov-report=xml --cov-report=term-missing
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ==========================================================================
  # Invariant Tests (Architecture Enforcement)
  # ==========================================================================
  invariant-tests:
    name: Invariant Tests (Architecture Enforcement)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run invariant tests
        run: |
          PYTHONPATH=. pytest tests/invariants -v --tb=short
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock

      - name: Fail if invariants violated
        run: |
          echo "✅ All architectural invariants preserved"
          echo "- No design terms in kernel stdlib"
          echo "- No hull_type dependencies in critical modules"
          echo "- Novel forms work without new code"

  # ==========================================================================
  # Integration Gate Runner (canonical "done" check)
  # ==========================================================================
  integration-gates:
    name: Integration Gates Runner
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run integration gates script
        run: |
          bash scripts/run_integration_gates.sh
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock

  # ==========================================================================
  # Validation Tests (Q1, Q5, Q10)
  # ==========================================================================
  validation-tests:
    name: Validation Tests (Primitive Completeness, Security)
    runs-on: ubuntu-latest
    needs: invariant-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run validation tests
        run: |
          PYTHONPATH=. pytest tests/validation -v --tb=short
          PYTHONPATH=. pytest tests/security -v --tb=short
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock

  # ==========================================================================
  # Integration Tests
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validation-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run integration tests
        run: |
          PYTHONPATH=. pytest tests/integration -v
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock
        continue-on-error: true

  # ==========================================================================
  # CAD Tests (no pythonocc): ensure deterministic degradation
  # ==========================================================================
  cad-tests:
    name: CAD Tests (No pythonocc)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run CAD tests (pythonocc should be absent)
        run: |
          PYTHONPATH=. pytest tests/cad -v --tb=short
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock

  # ==========================================================================
  # CAD Tests (with pythonocc via conda): exercise STEP/IGES path
  # ==========================================================================
  cad-tests-pythonocc:
    name: CAD Tests (With pythonocc via conda)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Run CAD tests (pythonocc present)
        shell: bash -l {0}
        run: |
          python -V
          PYTHONPATH=. pytest tests/cad -v --tb=short
        env:
          MAGNET_ENVIRONMENT: test
          MAGNET_LLM_PROVIDER: mock

  # ==========================================================================
  # Phase 3 (Optional, GPL-isolated): Capytaine service-boundary tests
  # Runs ONLY when explicitly enabled via workflow_dispatch input.
  # ==========================================================================
  phase3-capytaine-service:
    name: Phase 3 Capytaine Service (Optional)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capytaine_service == 'true') || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run service (docker compose profile)
        run: |
          docker compose -f deployment/docker-compose.yml --profile capytaine up -d --build capytaine
          # Wait for health
          for i in {1..20}; do
            if curl -fsS http://localhost:9001/health >/dev/null; then
              echo "capytaine service healthy"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9001/health

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install core test deps (pip-only)
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Phase 3 service-boundary tests
        env:
          MAGNET_CAPYTAINE_SERVICE_URL: http://localhost:9001
        run: |
          PYTHONPATH=. pytest tests/phase3 -v --tb=short

      - name: Tear down
        if: always()
        run: |
          docker compose -f deployment/docker-compose.yml --profile capytaine down -v

  # ==========================================================================
  # UI v2 Playwright Smoke (Nightly / Manual)
  # ==========================================================================
  uiv2-ui-smoke:
    name: UIv2 Playwright Smoke (Spiral)
    runs-on: ubuntu-latest
    # Run nightly (only for the nightly cron) or on explicit manual request.
    if: >-
      ${{
        (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_uiv2_ui_smoke == 'true')
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies (including Playwright)
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio playwright

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run UIv2 smoke test (fail-on-regression)
        env:
          RUN_UI_TESTS: "1"
        run: |
          PYTHONPATH=. pytest -q tests/ui/test_uiv2_spiral_shows_request_id_on_failure.py

  # ==========================================================================
  # Build Docker Image
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: magnet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Push to Registry (Main branch only)
  # ==========================================================================
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/magnet:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/magnet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run security scan
        run: bandit -r magnet/ -ll
        continue-on-error: true

  # ==========================================================================
  # Dependency Check
  # ==========================================================================
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check for vulnerabilities
        run: safety check -r requirements.txt
        continue-on-error: true
